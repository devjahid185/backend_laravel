location = /api/admin/live/events {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm-api.bholavashi.site.sock;
    fastcgi_param SCRIPT_FILENAME /home/new/web/api.bholavashi.site/public_html/backend_laravel/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;

    fastcgi_buffering off;
    fastcgi_request_buffering off;
    fastcgi_read_timeout 1900s;
    fastcgi_send_timeout 1900s;
    gzip off;
}
